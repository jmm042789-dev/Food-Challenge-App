services:
  - type: web
    name: fire-feast-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FIRE_FEAST_ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: fire_feast
